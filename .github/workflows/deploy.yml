name: Deploy to Rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rumahweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-deploy via SSH (Rumahweb port 2223)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            bash ~/deploy-rumahweb.sh